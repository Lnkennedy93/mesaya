name: Uptime
# Revisa cada 15 minutos que MesaYa responda. Si falla, GitHub te envía un correo con la ejecución fallida.
# (GitHub pausa los workflows programados si el repositorio pasa 60 días sin actividad.)
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: /healthz responde 200 y la base está bien
        run: curl -fsS --retry 3 --retry-delay 10 --max-time 20 https://mesaya-phi.vercel.app/healthz
